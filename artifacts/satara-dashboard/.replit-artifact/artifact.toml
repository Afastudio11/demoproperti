kind = "web"
previewPath = "/"
title = "Satara Development Dashboard"
version = "1.0.0"
id = "artifacts/satara-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25304

[services.development]
run = "pnpm --filter @workspace/satara-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/satara-dashboard", "run", "build" ]
publicDir = "artifacts/satara-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25304"
BASE_PATH = "/"
