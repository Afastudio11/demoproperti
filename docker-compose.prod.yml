services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: satara
      POSTGRES_USER: satara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SataraProperty2026!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satara -d satara"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://satara:${POSTGRES_PASSWORD:-SataraProperty2026!}@db:5432/satara
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://satara:${POSTGRES_PASSWORD:-SataraProperty2026!}@db:5432/satara
      SESSION_SECRET: ${SESSION_SECRET:-production-secret-satara-key-2026}
      STATIC_DIR: /app/public
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin123}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.demoproperti.rule=Host(`demoproperti.astintech.id`)"
      - "traefik.http.routers.demoproperti.entrypoints=websecure"
      - "traefik.http.routers.demoproperti.tls.certresolver=letsencrypt"
      - "traefik.http.routers.demoproperti-http.rule=Host(`demoproperti.astintech.id`)"
      - "traefik.http.routers.demoproperti-http.entrypoints=web"
      - "traefik.http.routers.demoproperti-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.services.demoproperti.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
  traefik-network:
    external: true
