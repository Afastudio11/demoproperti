components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── DASHBOARD ──────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [totalProjects, totalUnits, totalLeads, totalCustomers, activePhases, overallProgress]
      properties:
        totalProjects: { type: integer }
        totalUnits: { type: integer }
        totalLeads: { type: integer }
        totalCustomers: { type: integer }
        activePhases:
          type: array
          items:
            type: object
            required: [phase, count]
            properties:
              phase: { type: string }
              count: { type: integer }
        overallProgress: { type: number }
        projectsAtRisk: { type: integer }

    DashboardKpi:
      type: object
      required: [marketing, admin, production, legal, acquisition]
      properties:
        marketing:
          type: object
          required: [leads, cpl, conversionRate, bookingToAkad]
          properties:
            leads: { type: integer }
            cpl: { type: number }
            conversionRate: { type: number }
            bookingToAkad: { type: number }
        admin:
          type: object
          required: [pendingBerkas, sp3kCount, akadCount, rejectRate]
          properties:
            pendingBerkas: { type: integer }
            sp3kCount: { type: integer }
            akadCount: { type: integer }
            rejectRate: { type: number }
        production:
          type: object
          required: [avgProgress, deviation, defectRate, readyAkad]
          properties:
            avgProgress: { type: number }
            deviation: { type: number }
            defectRate: { type: number }
            readyAkad: { type: integer }
        legal:
          type: object
          required: [totalDocs, approved, pending, bankableProjects]
          properties:
            totalDocs: { type: integer }
            approved: { type: integer }
            pending: { type: integer }
            bankableProjects: { type: integer }
        acquisition:
          type: object
          required: [prospects, avgRoi, legalCleanRate]
          properties:
            prospects: { type: integer }
            avgRoi: { type: number }
            legalCleanRate: { type: number }

    CashflowOverview:
      type: object
      required: [totalIncome, totalExpense, netCashflow, forecast]
      properties:
        totalIncome: { type: number }
        totalExpense: { type: number }
        netCashflow: { type: number }
        forecast:
          type: array
          items:
            type: object
            required: [month, income, expense]
            properties:
              month: { type: string }
              income: { type: number }
              expense: { type: number }

    Alert:
      type: object
      required: [id, type, level, message, projectId, projectName, createdAt]
      properties:
        id: { type: integer }
        type: { type: string }
        level:
          type: string
          enum: [green, yellow, red]
